name: Build Flutter AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Auto bump version
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.0.0"
          fi

          VERSION=${LAST_TAG#v}

          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          BUILD_NUMBER=$(git rev-list --count HEAD)

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          echo "Version: $NEW_VERSION+$BUILD_NUMBER"

          sed -i "s/^version: .*/version: $NEW_VERSION+$BUILD_NUMBER/" pubspec.yaml

      - name: Verify API keys
        run: |
          if [ -z "${{ secrets.API_KEY }}" ] && [ -z "${{ vars.API_KEY }}" ]; then
            echo "::error::API_KEY missing from Secrets and Variables"
            exit 1
          fi

          if [ -z "${{ secrets.DEEPGRAM_API_KEY }}" ] && [ -z "${{ vars.DEEPGRAM_API_KEY }}" ]; then
            echo "::error::DEEPGRAM_API_KEY missing from Secrets and Variables"
            exit 1
          fi

          echo "API_KEY and DEEPGRAM_API_KEY detected"

      - name: Flutter clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate launcher icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build release AAB
        run: |
          flutter build appbundle \
            --release \
            --android-skip-build-dependency-validation \
            --dart-define=API_KEY=${{ secrets.API_KEY || vars.API_KEY }} \
            --dart-define=DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY || vars.DEEPGRAM_API_KEY }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.new_version }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Commit updated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml

          git diff --staged --quiet || \
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"

      - name: Create Git tag
        run: |
          git tag ${{ steps.version.outputs.new_tag }}

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin ${{ steps.version.outputs.new_tag }}
